name: CI

# Consolidated pipeline, intended to REPLACE the seven workflows currently in
# .github/workflows (build, ci, ci-cd, code-quality, enhanced-ci-cd, release,
# test - 1,023 lines). Six of those fire on the same push, and all seven are
# .NET-only, so the 630 frontend tests - the only verified part of this product
# - are never run by CI at all.
#
# HOW TO APPLY (this could not be committed automatically; see docs/ci/README.md):
#   git rm .github/workflows/{build,ci-cd,code-quality,enhanced-ci-cd,release,test}.yml
#   cp docs/ci/ci.yml .github/workflows/ci.yml
#   git add .github/workflows && git commit && git push

on:
  push:
    branches: ['**']
  pull_request:

# A new push supersedes an in-flight run of the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The frontend is fully verifiable and must stay green. It does not depend on
  # the backend, so it runs regardless of whether the .NET side compiles.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Loco.VisualEditor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/Loco.VisualEditor/package-lock.json

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

      - name: Build
        run: npm run build

      # Currently 0 errors / 57 warnings. Failing on errors only, so the gate
      # is meaningful today; switch to `lint:strict` once the warnings are gone.
      - name: Lint
        run: npm run lint

  # The backend was written in an environment where api.nuget.org is refused by
  # proxy policy, so it could never be restored or built there. It HAS since been
  # type-checked offline (scripts/typecheck-offline.sh compiles src/ and tests/
  # clean, method bodies included), but a type-check is not an execution. This
  # job is the real check, and the first green run is what retires the
  # VERIFICATION CAVEAT notes on the backend commits.
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Loco.sln

      - name: Build
        run: dotnet build Loco.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Loco.sln --no-build --configuration Release --verbosity normal

  # Runs the same offline checks a restore-less environment can run, so a
  # regression they WOULD catch is caught even if the restore above breaks.
  #
  # These are not a weaker copy of the backend job. Each check exists because
  # it found a defect the compiler could not: a project pinning a version
  # inline, which failed restore before any code was reached; a test naming a
  # class that was never written, which took its whole assembly down; and
  # 44,000 lines with no path to them from anything a user can do.
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Type-check without NuGet
        run: scripts/typecheck-offline.sh

      - name: Structural checks
        run: python3 scripts/check-structure.py

      # The same 432 tests the backend job runs, but without a restore. If
      # nuget.org is ever unreachable from the runner - the condition this
      # repository was written under - this job still says whether the
      # assertions hold.
      - name: Backend tests without NuGet
        run: scripts/run-tests-offline.sh
