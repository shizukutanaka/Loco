apiVersion: v2
name: loco
description: Enterprise Automation and Cognitive Workflow Platform
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - automation
  - workflow
  - ai
  - microservices
  - kubernetes
home: https://github.com/shizukutanaka/Loco
sources:
  - https://github.com/shizukutanaka/Loco
maintainers:
  - name: Loco Team
    email: support@loco.io
dependencies:
  - name: postgresql
    version: "12.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "17.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: rabbitmq
    version: "11.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: rabbitmq.enabled
annotations:
  category: Automation
  licenses: MIT
