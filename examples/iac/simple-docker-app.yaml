name: simple-docker-app
description: Simple containerized web application deployment
version: 1.0

provider:
  type: docker
  region: local

resources:
  - name: app-network
    type: network
    properties:
      driver: bridge
      attachable: true
      labels:
        environment: development
        app: simple-web

  - name: app-volume
    type: volume
    properties:
      driver: local
      labels:
        app: simple-web
        purpose: data-storage

  - name: web-container
    type: container
    properties:
      image: nginx:latest
      name: simple-web-app
      ports:
        - "8080:80"
      networks:
        - app-network
      volumes:
        - app-volume:/usr/share/nginx/html
      environment:
        - NGINX_HOST=localhost
        - NGINX_PORT=80
      restart: unless-stopped
      labels:
        app: simple-web
        tier: frontend
    healthCheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  - name: app-database
    type: container
    properties:
      image: postgres:15-alpine
      name: simple-db
      ports:
        - "5432:5432"
      networks:
        - app-network
      volumes:
        - app-volume:/var/lib/postgresql/data
      environment:
        - POSTGRES_DB=appdb
        - POSTGRES_USER=appuser
        - POSTGRES_PASSWORD=changeme123
      restart: unless-stopped
      labels:
        app: simple-web
        tier: database
    healthCheck:
      test: ["CMD-SHELL", "pg_isready -U appuser"]
      interval: 10s
      timeout: 5s
      retries: 5

workflows:
  - name: startup
    description: Start all application services
    steps:
      - type: resource
        action: create
        resource: app-network
      - type: resource
        action: create
        resource: app-volume
      - type: resource
        action: start
        resource: app-database
        wait: 30s
      - type: resource
        action: start
        resource: web-container
        wait: 10s

  - name: shutdown
    description: Stop all application services gracefully
    steps:
      - type: resource
        action: stop
        resource: web-container
        timeout: 30s
      - type: resource
        action: stop
        resource: app-database
        timeout: 30s

  - name: update
    description: Update application with zero downtime
    steps:
      - type: image
        action: pull
        image: nginx:latest
      - type: resource
        action: create
        resource: web-container
        name: web-container-new
      - type: health
        action: check
        resource: web-container-new
        maxRetries: 5
      - type: resource
        action: stop
        resource: web-container
      - type: resource
        action: remove
        resource: web-container
      - type: resource
        action: rename
        resource: web-container-new
        newName: web-container

monitoring:
  enabled: true
  interval: 60s
  alerts:
    - type: container_stopped
      severity: high
      action: restart
    - type: health_check_failed
      severity: critical
      action: notify

backup:
  enabled: true
  schedule: "0 2 * * *"
  retention: 7d
  targets:
    - app-volume

metadata:
  author: Loco Team
  tags:
    - docker
    - web
    - database
  category: Application
  difficulty: beginner
  estimatedTime: 5min
