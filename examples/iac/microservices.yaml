name: microservices-platform
description: Microservices infrastructure with container orchestration
version: 1.0.0

platform:
  type: kubernetes
  version: "1.28"
  region: us-east-1

cluster:
  name: production-cluster
  node_pools:
    - name: system-pool
      instance_type: t3.medium
      min_size: 2
      max_size: 4
      desired_size: 2
      labels:
        workload: system

    - name: app-pool
      instance_type: t3.large
      min_size: 3
      max_size: 10
      desired_size: 5
      labels:
        workload: application
      taints:
        - key: workload
          value: application
          effect: NoSchedule

services:
  # API Gateway
  - name: api-gateway
    type: deployment
    replicas: 3
    image: gateway:latest
    resources:
      cpu: 500m
      memory: 1Gi
      limits:
        cpu: 1000m
        memory: 2Gi
    ports:
      - name: http
        port: 8080
        targetPort: 8080
    env:
      - name: LOG_LEVEL
        value: info
      - name: RATE_LIMIT
        value: "1000"

  # User Service
  - name: user-service
    type: deployment
    replicas: 2
    image: user-service:latest
    resources:
      cpu: 250m
      memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    ports:
      - name: grpc
        port: 9090
    env:
      - name: DB_HOST
        valueFrom:
          secretKeyRef:
            name: db-credentials
            key: host

  # Order Service
  - name: order-service
    type: deployment
    replicas: 3
    image: order-service:latest
    resources:
      cpu: 500m
      memory: 1Gi
      limits:
        cpu: 1000m
        memory: 2Gi
    ports:
      - name: http
        port: 8081

  # Payment Service
  - name: payment-service
    type: deployment
    replicas: 2
    image: payment-service:latest
    resources:
      cpu: 250m
      memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    ports:
      - name: http
        port: 8082

  # Notification Service
  - name: notification-service
    type: deployment
    replicas: 2
    image: notification-service:latest
    resources:
      cpu: 250m
      memory: 512Mi
    ports:
      - name: http
        port: 8083

databases:
  # PostgreSQL for User Service
  - name: user-db
    type: postgresql
    version: "15"
    instance_class: db.t3.medium
    storage: 100Gi
    backup:
      enabled: true
      retention: 7

  # MongoDB for Order Service
  - name: order-db
    type: mongodb
    version: "7.0"
    instance_class: db.t3.medium
    storage: 200Gi
    replication_factor: 3

caching:
  - name: redis-cluster
    type: redis
    version: "7.0"
    node_type: cache.t3.medium
    num_cache_nodes: 3
    automatic_failover: true

messaging:
  - name: message-queue
    type: rabbitmq
    version: "3.12"
    instance_type: mq.t3.micro
    deployment_mode: cluster

networking:
  ingress:
    enabled: true
    class: nginx
    tls:
      enabled: true
      secretName: tls-certificate
    rules:
      - host: api.example.com
        paths:
          - path: /
            service: api-gateway
            port: 8080

  service_mesh:
    enabled: true
    type: istio
    version: "1.19"

monitoring:
  prometheus:
    enabled: true
    retention: 15d
    storage: 50Gi

  grafana:
    enabled: true
    dashboards:
      - kubernetes-cluster
      - microservices-overview
      - service-performance

  logging:
    enabled: true
    type: elasticsearch
    version: "8.10"
    storage: 200Gi

autoscaling:
  enabled: true
  metrics:
    - type: cpu
      target: 70
    - type: memory
      target: 80
    - type: requests_per_second
      target: 1000

security:
  network_policies:
    enabled: true
  pod_security_policy:
    enabled: true
  secrets_encryption:
    enabled: true
    kms_key_id: arn:aws:kms:us-east-1:123456789:key/abc123

disaster_recovery:
  backup:
    enabled: true
    schedule: "0 */6 * * *"
    retention: 30
  cross_region_replication:
    enabled: true
    target_region: us-west-2
