version: '3.8'

# The only image built from this repository is the Loco API: the root
# Dockerfile has exactly two stages, "build" and "runtime", and the
# runtime stage serves Loco.Api on port 5000. There is no web or CLI
# stage (the CLI ships as the single-file binary from the release
# workflow), so this file defines no web/cli services. The Prometheus,
# Grafana and Nginx services that used to be listed here were removed
# with them: they bind-mounted ./monitoring/* and ./nginx/* files that
# do not exist anywhere in this repository, so they could never start
# (and Nginx also depended on the nonexistent web service).

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: loco-postgres
    environment:
      POSTGRES_DB: loco
      POSTGRES_USER: loco_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loco_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - loco-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loco_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: loco-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - loco-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Elasticsearch for logging and search
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    container_name: loco-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - loco-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Kibana for log visualization
  kibana:
    image: docker.elastic.co/kibana/kibana:8.10.2
    container_name: loco-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - loco-network
    depends_on:
      - elasticsearch

  # RabbitMQ for message queuing
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: loco-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin}
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - loco-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Jaeger for distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: loco-jaeger
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"
      - "14250:14250"
      - "14268:14268"
      - "14269:14269"
      - "9411:9411"
    networks:
      - loco-network

  # Loco API Service
  # Built from the root Dockerfile's final ("runtime") stage, which
  # listens on port 5000 (ASPNETCORE_URLS=http://+:5000).
  loco-api:
    build:
      context: .
      target: runtime
    container_name: loco-api
    environment:
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=loco;Username=loco_user;Password=${POSTGRES_PASSWORD:-loco_password}
      - Redis__ConnectionString=redis:6379
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=${RABBITMQ_USER:-admin}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-admin}
      - Elasticsearch__Uri=http://elasticsearch:9200
      # Tracing: the API exports traces with the OpenTelemetry OTLP
      # exporter (gRPC) and reads the destination from the
      # "OpenTelemetry:OtlpEndpoint" configuration key (Program.cs).
      # The legacy Jaeger agent variables (Jaeger__AgentHost /
      # Jaeger__AgentPort, UDP 6831) were never read by any code, so
      # traces silently went to the appsettings default
      # (http://localhost:4317, i.e. inside the API container itself).
      # Jaeger all-in-one accepts OTLP gRPC on port 4317 by default.
      - OpenTelemetry__OtlpEndpoint=http://jaeger:4317
    ports:
      - "5000:5000"
    networks:
      - loco-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

networks:
  loco-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
  rabbitmq_data:
