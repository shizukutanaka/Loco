version: '3.8'

# Loco is a self-contained application: the API persists its rules in a
# JSON file (JsonFileRuleStore) and has no database, cache, message queue
# or search engine. The PostgreSQL, Redis, RabbitMQ, Elasticsearch and
# Kibana services that used to be defined here were removed: no code in
# the API ever read the connection settings compose passed for them, so
# they only looked like part of the architecture. The stack is now just
# the API plus Jaeger, which the API really does export traces to.
#
# The only image built from this repository is the Loco API: the root
# Dockerfile has exactly two stages, "build" and "runtime", and the
# runtime stage serves Loco.Api on port 5000. There is no web or CLI
# stage (the CLI ships as the single-file binary from the release
# workflow), so this file defines no web/cli services.

services:
  # Jaeger for distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: loco-jaeger
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"
      - "14250:14250"
      - "14268:14268"
      - "14269:14269"
      - "9411:9411"
    networks:
      - loco-network

  # Loco API Service
  # Built from the root Dockerfile's final ("runtime") stage, which
  # listens on port 5000 (ASPNETCORE_URLS=http://+:5000).
  loco-api:
    build:
      context: .
      target: runtime
    container_name: loco-api
    environment:
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT:-Development}
      # Self-contained file storage on the named volume below, so rules
      # survive container recreation (previously the store defaulted to a
      # file inside the container's writable layer and was lost).
      - RULE_STORE_PATH=/data/rules.json
      # JWT signing secret (Jwt:SecretKey). Optional: when left empty the
      # API generates a per-installation secret on first start and
      # persists it next to the rule store (/data/jwt-secret.key), so
      # issued tokens stay valid across restarts. Set JWT_SECRET_KEY in
      # the environment (or a .env file) to pin your own value instead.
      - Jwt__SecretKey=${JWT_SECRET_KEY:-}
      # Tracing: the API exports traces with the OpenTelemetry OTLP
      # exporter (gRPC) and reads the destination from the
      # "OpenTelemetry:OtlpEndpoint" configuration key (Program.cs).
      # Jaeger all-in-one accepts OTLP gRPC on port 4317 by default.
      - OpenTelemetry__OtlpEndpoint=http://jaeger:4317
    volumes:
      - loco_data:/data
    ports:
      - "5000:5000"
    networks:
      - loco-network
    restart: unless-stopped

networks:
  loco-network:
    driver: bridge

volumes:
  loco_data:
