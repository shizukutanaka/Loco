version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: loco-postgres
    environment:
      POSTGRES_DB: loco
      POSTGRES_USER: loco_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - loco-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loco_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: loco-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - loco-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Elasticsearch for logging and search
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    container_name: loco-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - loco-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Kibana for log visualization
  kibana:
    image: docker.elastic.co/kibana/kibana:8.10.2
    container_name: loco-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - loco-network
    depends_on:
      - elasticsearch

  # RabbitMQ for message queuing
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: loco-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin}
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - loco-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Jaeger for distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: loco-jaeger
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"
      - "14250:14250"
      - "14268:14268"
      - "14269:14269"
      - "9411:9411"
    networks:
      - loco-network

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: loco-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - loco-network

  # Grafana for metrics visualization
  grafana:
    image: grafana/grafana:latest
    container_name: loco-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=redis-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3000:3000"
    networks:
      - loco-network
    depends_on:
      - prometheus

  # Loco API Service
  loco-api:
    build:
      context: .
      target: api
    container_name: loco-api
    environment:
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=loco;Username=loco_user;Password=${POSTGRES_PASSWORD:-changeme}
      - Redis__ConnectionString=redis:6379
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=${RABBITMQ_USER:-admin}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-admin}
      - Elasticsearch__Uri=http://elasticsearch:9200
      - Jaeger__AgentHost=jaeger
      - Jaeger__AgentPort=6831
    ports:
      - "5000:80"
    networks:
      - loco-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # Loco Web Service
  loco-web:
    build:
      context: .
      target: web
    container_name: loco-web
    environment:
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT:-Development}
      - ApiUrl=http://loco-api
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=loco;Username=loco_user;Password=${POSTGRES_PASSWORD:-changeme}
      - Redis__ConnectionString=redis:6379
    ports:
      - "5001:80"
    networks:
      - loco-network
    depends_on:
      - loco-api
    restart: unless-stopped

  # Loco CLI Service (for scheduled jobs)
  loco-cli:
    build:
      context: .
      target: cli
    container_name: loco-cli
    environment:
      - DOTNET_ENVIRONMENT=${ENVIRONMENT:-Development}
      - ApiUrl=http://loco-api
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=loco;Username=loco_user;Password=${POSTGRES_PASSWORD:-changeme}
    networks:
      - loco-network
    depends_on:
      - loco-api
    restart: unless-stopped
    command: ["health"] # Default command, can be overridden

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: loco-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites-enabled:/etc/nginx/sites-enabled:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - loco-network
    depends_on:
      - loco-api
      - loco-web

networks:
  loco-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data: