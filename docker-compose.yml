version: '3.8'

services:
  loco-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: shizukutanaka/loco:latest
    container_name: loco-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - loco-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 256M
        reservations:
          cpus: '0.5'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  # Optional: Redis for distributed caching
  redis:
    image: redis:7-alpine
    container_name: loco-redis
    restart: unless-stopped
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    networks:
      - loco-network
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          memory: 128M

  # Optional: Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: loco-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    ports:
      - "9090:9090"
    networks:
      - loco-network
    deploy:
      resources:
        limits:
          memory: 256M

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: loco-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=redis-datasource
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - loco-network
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  loco-network:
    driver: bridge

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
