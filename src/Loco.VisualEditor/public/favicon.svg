<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Loco">
  <title>Loco</title>
  <!-- Three nodes joined left to right: the shape of a workflow, which is
       what the editor draws. Flat colours and no gradients so it stays
       legible at 16px. -->
  <rect width="32" height="32" rx="7" fill="#2563eb"/>
  <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
    <path d="M10 16h4M18 16h4"/>
  </g>
  <circle cx="8" cy="16" r="3" fill="#ffffff"/>
  <circle cx="16" cy="16" r="3" fill="#ffffff"/>
  <circle cx="24" cy="16" r="3" fill="#ffffff"/>
</svg>
