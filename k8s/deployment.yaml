apiVersion: apps/v1
kind: Deployment
metadata:
  name: loco-api
  namespace: loco
  labels:
    app: loco-api
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: loco-api
  template:
    metadata:
      labels:
        app: loco-api
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: loco-api
      containers:
      - name: loco-api
        image: loco/api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        - containerPort: 8080
          name: metrics
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: loco-secrets
              key: db-connection
        - name: Redis__ConnectionString
          valueFrom:
            configMapKeyRef:
              name: loco-config
              key: redis-connection
        - name: RabbitMQ__HostName
          valueFrom:
            configMapKeyRef:
              name: loco-config
              key: rabbitmq-host
        - name: Jaeger__AgentHost
          value: "jaeger-agent.istio-system"
        - name: Jaeger__AgentPort
          value: "6831"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health/startup
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 30
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: secrets
          mountPath: /app/secrets
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: loco-config
      - name: secrets
        secret:
          secretName: loco-secrets
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loco-web
  namespace: loco
  labels:
    app: loco-web
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: loco-web
  template:
    metadata:
      labels:
        app: loco-web
        version: v1
    spec:
      serviceAccountName: loco-web
      containers:
      - name: loco-web
        image: loco/web:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ApiUrl
          value: "http://loco-api-service"
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: loco-secrets
              key: db-connection
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loco-postgres
  namespace: loco
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: "loco"
        - name: POSTGRES_USER
          value: "loco_user"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: loco-secrets
              key: postgres-password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
  volumeClaimTemplates:
  - metadata:
      name: postgres-storage
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: "standard"
      resources:
        requests:
          storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loco-redis
  namespace: loco
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        command:
        - redis-server
        - --appendonly
        - "yes"
        ports:
        - containerPort: 6379
          name: redis
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        volumeMounts:
        - name: redis-storage
          mountPath: /data
      volumes:
      - name: redis-storage
        persistentVolumeClaim:
          claimName: redis-pvc
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: loco-cli-backup
  namespace: loco
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: loco-cli
          containers:
          - name: loco-cli
            image: loco/cli:latest
            command:
            - dotnet
            - Loco.Cli.dll
            - backup
            - --type
            - full
            env:
            - name: DOTNET_ENVIRONMENT
              value: "Production"
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: loco-secrets
                  key: db-connection
          restartPolicy: OnFailure
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: loco-api-hpa
  namespace: loco
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: loco-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60