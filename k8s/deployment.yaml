# Phase 3: Kubernetes Deployment Configuration
# Enterprise-grade production deployment with resource management, auto-scaling, and observability

apiVersion: v1
kind: Namespace
metadata:
  name: loco
  labels:
    name: loco
    environment: production

---
# ConfigMap for application settings
apiVersion: v1
kind: ConfigMap
metadata:
  name: loco-config
  namespace: loco
  labels:
    app: loco
    version: "3.0.0"
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:5000"
  ASPNETCORE_FORWARDEDHEADERSENABLED: "true"
  ConnectionStrings__DefaultConnection: "Data Source=/data/loco.db;Cache=Shared"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger-collector:4317"
  OTEL_SERVICE_NAME: "loco-workflow-api"
  Logging__LogLevel__Default: "Information"
  Logging__LogLevel__Microsoft: "Warning"

---
# Secret for sensitive configuration
apiVersion: v1
kind: Secret
metadata:
  name: loco-secrets
  namespace: loco
type: Opaque
stringData:
  JWT_SECRET_KEY: "YourSuperSecretKeyThatMustBeAtLeast32CharactersLongForHS256!!!"
  JWT_ISSUER: "https://loco.local"
  JWT_AUDIENCE: "loco-api"

---
# PersistentVolumeClaim for SQLite database
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loco-data-pvc
  namespace: loco
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 10Gi

---
# Service Account for RBAC
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loco-api
  namespace: loco

---
# Deployment configuration
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loco-api
  namespace: loco
  labels:
    app: loco
    component: api
    version: "3.0.0"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: loco
      component: api

  template:
    metadata:
      labels:
        app: loco
        component: api
        version: "3.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"

    spec:
      serviceAccountName: loco-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      containers:
      - name: loco-api
        image: loco:3.0.0
        imagePullPolicy: IfNotPresent

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL

        ports:
        - name: http
          containerPort: 5000
          protocol: TCP

        envFrom:
        - configMapRef:
            name: loco-config

        env:
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: loco-secrets
              key: JWT_SECRET_KEY

        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"

        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 0
          periodSeconds: 5
          failureThreshold: 30

        volumeMounts:
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/cache

      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: loco-data-pvc
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
      - name: cache
        emptyDir:
          sizeLimit: 500Mi

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - loco
              topologyKey: kubernetes.io/hostname

      terminationGracePeriodSeconds: 30

---
# ClusterRole for service account
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: loco-api
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]

---
# ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: loco-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: loco-api
subjects:
- kind: ServiceAccount
  name: loco-api
  namespace: loco

---
# Service for API
apiVersion: v1
kind: Service
metadata:
  name: loco-api
  namespace: loco
  labels:
    app: loco
    component: api
spec:
  type: ClusterIP
  selector:
    app: loco
    component: api
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP

---
# HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: loco-api-hpa
  namespace: loco
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: loco-api

  minReplicas: 3
  maxReplicas: 10

  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 15
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15

---
# PodDisruptionBudget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: loco-api-pdb
  namespace: loco
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: loco
      component: api
