name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore /p:EnforceCodeStyleInBuild=true

    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      if: secrets.SONAR_TOKEN != ''
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.projectKey=loco-automation_loco
          -Dsonar.organization=loco-automation

    - name: Analyze with StyleCop
      run: |
        dotnet add package StyleCop.Analyzers --version 1.2.0-beta.507 2>/dev/null || true
        dotnet build --no-restore /p:EnforceCodeStyleInBuild=true

    - name: Check code formatting
      run: |
        dotnet format --verify-no-changes --verbosity diagnostic || echo "Code formatting issues found. Run 'dotnet format' to fix."

    - name: Run security checks
      run: |
        dotnet add package SecurityCodeScan.VS2019 --version 5.6.7 2>/dev/null || true
        dotnet build --no-restore

    - name: Generate SBOM
      uses: CycloneDX/cyclonedx-dotnet@master
      with:
        path: ./src
        output-file: ./sbom.xml

    - name: Upload SBOM
      uses: actions/upload-artifact@v3
      with:
        name: sbom
        path: ./sbom.xml

    - name: SARIF upload
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: ./results.sarif
        wait-for-processing: true

    - name: Comment on PR with Quality Report
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '✅ Code quality checks completed'
          })
