name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore /p:EnforceCodeStyleInBuild=true

    # NOTE: 'secrets' cannot be referenced in a step-level 'if' — doing so
    # makes the whole workflow file invalid ("Unrecognized named-value:
    # 'secrets'"), which is why this workflow failed on every run.
    # Detect the token in a shell step and gate the scan on its output.
    - name: Check SonarCloud configuration
      id: sonar
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        if [ -n "$SONAR_TOKEN" ]; then
          echo "enabled=true" >> "$GITHUB_OUTPUT"
        else
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "SONAR_TOKEN is not configured; skipping SonarCloud scan."
        fi

    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      if: steps.sonar.outputs.enabled == 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.projectKey=loco-automation_loco
          -Dsonar.organization=loco-automation

    - name: Analyze with StyleCop
      run: |
        dotnet add package StyleCop.Analyzers --version 1.2.0-beta.507 2>/dev/null || true
        dotnet build --no-restore /p:EnforceCodeStyleInBuild=true

    - name: Check code formatting
      run: |
        dotnet format --verify-no-changes --verbosity diagnostic || echo "Code formatting issues found. Run 'dotnet format' to fix."

    - name: Run security checks
      run: |
        dotnet add package SecurityCodeScan.VS2019 --version 5.6.7 2>/dev/null || true
        dotnet build --no-restore

    - name: Generate SBOM
      uses: CycloneDX/cyclonedx-dotnet@master
      with:
        path: ./src
        output-file: ./sbom.xml

    - name: Upload SBOM
      uses: actions/upload-artifact@v5
      with:
        name: sbom
        path: ./sbom.xml

    - name: Comment on PR with Quality Report
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '✅ Code quality checks completed'
          })
