name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Run Unit Tests
      run: |
        dotnet test tests/Loco.Core.Tests \
          --configuration Release \
          --no-build \
          --logger "console;verbosity=detailed" \
          --logger "trx;LogFileName=test-results.trx" \
          --collect:"XPlat Code Coverage" \
          --results-directory="./test-results"

    - name: Run Integration Tests
      run: |
        dotnet test tests/Loco.Cli.Tests \
          --configuration Release \
          --no-build \
          --logger "console;verbosity=detailed" \
          --logger "trx;LogFileName=integration-results.trx" \
          --results-directory="./test-results"

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results
        path: ./test-results
        retention-days: 30

    - name: Publish Test Report
      if: always()
      uses: dorny/test-reporter@v1
      with:
        name: Test Results
        path: './test-results/*.trx'
        reporter: 'dotnet trx'
        fail-on-error: true

    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./test-results/coverage.cobertura.xml
        flags: unittests
        name: codecov

    - name: Code Coverage Badge
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const coverage = fs.readFileSync('./test-results/coverage.cobertura.xml', 'utf8');
          const match = coverage.match(/line-rate="([^"]+)"/);
          if (match) {
            const rate = Math.round(parseFloat(match[1]) * 100);
            console.log(`Coverage: ${rate}%`);
          }

    - name: Comment PR with Results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const testResults = 'Test Results Generated';
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `✅ All tests passed successfully!`
          });
