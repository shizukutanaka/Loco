name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Run Unit Tests
      run: |
        dotnet test tests/Loco.Core.Tests \
          --configuration Release \
          --no-build \
          --logger "console;verbosity=detailed" \
          --logger "trx;LogFileName=test-results.trx" \
          --collect:"XPlat Code Coverage" \
          --results-directory="./test-results"

    - name: Run Integration Tests
      run: |
        dotnet test tests/Loco.Cli.Tests \
          --configuration Release \
          --no-build \
          --logger "console;verbosity=detailed" \
          --logger "trx;LogFileName=integration-results.trx" \
          --results-directory="./test-results"

    - name: Collect Test Outputs
      if: always()
      run: |
        # VSTest writes logger/collector outputs into a per-run subdirectory
        # of --results-directory (for example
        # ./test-results/<run-id>/coverage.cobertura.xml), but the Codecov,
        # badge and test-reporter steps below read flat paths such as
        # ./test-results/coverage.cobertura.xml and ./test-results/*.trx,
        # which therefore never existed. Copy the outputs to the flat
        # locations those steps expect.
        coverage_file="$(find ./test-results -name 'coverage.cobertura.xml' | head -n 1)"
        if [ -n "$coverage_file" ] && [ "$coverage_file" != "./test-results/coverage.cobertura.xml" ]; then
          cp "$coverage_file" ./test-results/coverage.cobertura.xml
        fi
        find ./test-results -mindepth 2 -name '*.trx' -exec cp -f {} ./test-results/ \;

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: test-results
        path: ./test-results
        retention-days: 30

    - name: Publish Test Report
      if: always()
      uses: dorny/test-reporter@v1
      with:
        name: Test Results
        path: './test-results/*.trx'
        reporter: 'dotnet-trx'
        fail-on-error: true

    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: ./test-results/coverage.cobertura.xml
        flags: unittests
        name: codecov

    - name: Code Coverage Badge
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const coverage = fs.readFileSync('./test-results/coverage.cobertura.xml', 'utf8');
          const match = coverage.match(/line-rate="([^"]+)"/);
          if (match) {
            const rate = Math.round(parseFloat(match[1]) * 100);
            console.log(`Coverage: ${rate}%`);
          }

    - name: Comment PR with Results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const testResults = 'Test Results Generated';
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `✅ All tests passed successfully!`
          });
