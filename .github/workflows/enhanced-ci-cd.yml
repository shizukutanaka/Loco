name: Enhanced CI/CD Pipeline with Improvements

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday at 2 AM UTC

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOTNET_VERSION: 8.0.x
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Job 1: Code Quality & Linting
  code-quality:
    runs-on: ubuntu-latest
    name: Code Quality Analysis

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build -c Release --no-restore

    - name: Run code analysis
      run: dotnet build -c Release --no-restore /p:EnforceCodeStyleInBuild=true

    - name: SonarCloud Scan (if main branch)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Job 2: Unit & Integration Tests
  test:
    runs-on: ubuntu-latest
    name: Tests
    strategy:
      matrix:
        test-project:
          - tests/Loco.Core.Tests/Loco.Core.Tests.csproj
          - tests/Loco.Api.Tests/Loco.Api.Tests.csproj
          - tests/Loco.Cli.Tests/Loco.Cli.Tests.csproj

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Run tests - ${{ matrix.test-project }}
      run: |
        dotnet test ${{ matrix.test-project }} \
          -c Release \
          --no-restore \
          --logger:"console;verbosity=detailed" \
          --collect:"XPlat Code Coverage" \
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage/coverage.opencover.xml
        fail_ci_if_error: false
        verbose: true

  # Job 3: Security Scanning
  security:
    runs-on: ubuntu-latest
    name: Security Analysis

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Restore dependencies
      run: dotnet restore

    - name: Run dependency check
      run: dotnet list package --vulnerable

  # Job 4: Build Docker Images
  docker:
    runs-on: ubuntu-latest
    name: Build Docker Images
    permissions:
      contents: read
      packages: write
    needs: [code-quality, test]

    strategy:
      matrix:
        target: [api, web, cli]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha
          type=raw,value=${{ matrix.target }}-latest

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        target: ${{ matrix.target }}
        push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Job 5: Integration Tests (with Docker Compose)
  integration-tests:
    runs-on: ubuntu-latest
    name: Integration Tests
    needs: docker

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: loco_test
          POSTGRES_USER: loco_user
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Run integration tests
      env:
        ConnectionStrings__DefaultConnection: "Host=localhost;Database=loco_test;Username=loco_user;Password=testpass"
        Redis__ConnectionString: "localhost:6379"
      run: |
        dotnet test tests/Loco.Integration.Tests/Loco.Integration.Tests.csproj \
          -c Release \
          --no-restore \
          --logger:"console;verbosity=detailed"

  # Job 6: Performance Testing
  performance:
    runs-on: ubuntu-latest
    name: Performance Testing
    needs: integration-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Build Benchmark
      run: |
        dotnet build src/Loco.Benchmarks/Loco.Benchmarks.csproj -c Release

    - name: Run Performance Benchmarks
      run: |
        dotnet run -p src/Loco.Benchmarks/Loco.Benchmarks.csproj -c Release -- \
          --exporters json \
          --artifacts /tmp/benchmarks

    - name: Upload benchmark results
      uses: actions/upload-artifact@v3
      with:
        name: benchmark-results
        path: /tmp/benchmarks/

    - name: Comment benchmark results (if PR)
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const benchmarks = fs.readdirSync('/tmp/benchmarks/');
          let comment = '## Performance Benchmark Results\n\n';
          benchmarks.forEach(file => {
            if (file.endsWith('.json')) {
              const data = JSON.parse(fs.readFileSync(`/tmp/benchmarks/${file}`, 'utf8'));
              comment += `\n**${file}**:\n\`\`\`json\n${JSON.stringify(data, null, 2)}\n\`\`\`\n`;
            }
          });
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

  # Job 7: Deploy to Staging (Main Branch Only)
  deploy-staging:
    runs-on: ubuntu-latest
    name: Deploy to Staging
    needs: [code-quality, test, security, docker, integration-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: ${{ steps.deployment.outputs.environment_url }}

    steps:
    - uses: actions/checkout@v4

    - name: Deploy to Staging
      id: deployment
      run: |
        echo "Deploying to staging environment..."
        echo "::set-output name=environment_url::https://staging-api.example.com"
        # Add actual deployment commands here
        # e.g., kubectl apply, docker pull and run, etc.

  # Job 8: Build Report
  build-report:
    runs-on: ubuntu-latest
    name: Build Report
    needs: [code-quality, test, security, docker]
    if: always()

    steps:
    - name: Generate build summary
      run: |
        echo "# Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Jobs Status" >> $GITHUB_STEP_SUMMARY
        echo "- Code Quality: ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Tests: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Security: ${{ needs.security.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Docker Build: ${{ needs.docker.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Workflow Run" >> $GITHUB_STEP_SUMMARY
        echo "[View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

    - name: Slack Notification (if failure)
      if: failure()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: 'CI/CD Pipeline Failed'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        fields: repo,message,commit,author,action,eventName

  # Job 9: Notify on Success
  success-notification:
    runs-on: ubuntu-latest
    name: Success Notification
    needs: [code-quality, test, security, docker, integration-tests]
    if: success()

    steps:
    - name: Success Message
      run: |
        echo "✅ All checks passed successfully!"
        echo "- Code Quality: PASSED"
        echo "- Tests: PASSED"
        echo "- Security Scan: PASSED"
        echo "- Docker Build: PASSED"
        echo "- Integration Tests: PASSED"
