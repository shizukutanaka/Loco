name: Loco CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [published]

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_PATH: Loco.sln

jobs:
  build-and-test:
    name: Build and Test
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}

    - name: Build solution
      run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

    - name: Run unit tests with coverage
      run: dotnet test ${{ env.SOLUTION_PATH }} --configuration Release --no-build --verbosity normal --logger trx --results-directory test-results --collect:"XPlat Code Coverage"

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: test-results/**/coverage.cobertura.xml
        flags: unittests
        name: codecov-umbrella

    - name: Upload test results
      uses: actions/upload-artifact@v5
      if: always()
      with:
        name: test-results
        path: test-results/

  security-scan:
    name: Security Scan
    runs-on: windows-latest
    needs: build-and-test

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}

    - name: Run security scan
      shell: bash
      run: |
        dotnet list ${{ env.SOLUTION_PATH }} package --vulnerable --include-transitive 2>&1 | tee security-scan.log
        if grep -q "has the following vulnerable packages" security-scan.log; then
          echo "::warning::Vulnerable packages detected"
        fi

    - name: Upload security scan results
      uses: actions/upload-artifact@v5
      with:
        name: security-scan-results
        path: security-scan.log

  publish:
    name: Publish Artifacts
    runs-on: windows-latest
    needs: [build-and-test, security-scan]
    if: github.event_name == 'release'

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Publish CLI for Windows x64
      run: .\build.bat publish
      env:
        PUBLISH_RUNTIME: win-x64

    - name: Publish CLI for Linux x64
      run: dotnet publish src/Loco.Cli/Loco.Cli.csproj -c Release -r linux-x64 --self-contained -p:PublishSingleFile=true -p:PublishTrimmed=true -o publish-linux-x64
      env:
        PUBLISH_RUNTIME: linux-x64

    - name: Publish CLI for macOS x64
      run: dotnet publish src/Loco.Cli/Loco.Cli.csproj -c Release -r osx-x64 --self-contained -p:PublishSingleFile=true -p:PublishTrimmed=true -o publish-osx-x64
      env:
        PUBLISH_RUNTIME: osx-x64

    - name: Create release archives
      run: |
        Compress-Archive -Path publish-production\* -DestinationPath loco-cli-windows-x64.zip
        Compress-Archive -Path publish-linux-x64\* -DestinationPath loco-cli-linux-x64.zip
        Compress-Archive -Path publish-osx-x64\* -DestinationPath loco-cli-macos-x64.zip

    - name: Upload release assets
      uses: softprops/action-gh-release@v2
      with:
        files: |
          loco-cli-windows-x64.zip
          loco-cli-linux-x64.zip
          loco-cli-macos-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'release'

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # The only Dockerfile in this repository is ./Dockerfile (the API
    # image). The previously referenced deployment/Dockerfile.cli and
    # deployment/Dockerfile.gui do not exist.
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: locoautomation/loco:latest, locoautomation/loco:${{ github.event.release.tag_name }}

  notify-release:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: [publish, deploy-docker]
    if: github.event_name == 'release'

    steps:
    - name: Send notification
      run: |
        echo "🚀 Loco Automation Platform v${{ github.event.release.tag_name }} has been released!"
        echo "📦 Available on:"
        echo "  - GitHub Releases: https://github.com/${{ github.repository }}/releases/tag/${{ github.event.release.tag_name }}"
        echo "  - Docker Hub: locoautomation/loco:${{ github.event.release.tag_name }}"
        echo ""
        echo "📊 Release Summary:"
        echo "${{ github.event.release.body }}"
